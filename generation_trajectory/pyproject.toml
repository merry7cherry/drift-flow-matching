[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drift-flow-matching-trajectories"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "matplotlib==3.9.4",
  "numpy==2.0.2",
  "torch==2.8.0",
]

[project.scripts]
dfm-trajectories = "flowviz.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
