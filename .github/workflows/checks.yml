name: CPU checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            image_generation/pyproject.toml
            image_generation/constraints-tested.txt
            generation_trajectory/pyproject.toml
      - name: Install CPU dependencies and modules
        run: |
          python -m pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -c image_generation/constraints-tested.txt -e './image_generation[eval,dev,data]' -e ./generation_trajectory
      - name: Image tests
        run: python -m pytest image_generation/tests -q
      - name: Trajectory tests
        run: python -m unittest discover -s generation_trajectory/tests -v
      - name: Check project-page assets
        run: python scripts/check_site.py
